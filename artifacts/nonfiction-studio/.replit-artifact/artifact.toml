kind = "web"
previewPath = "/"
title = "Nonfiction AI Studio"
version = "1.0.0"
id = "artifacts/nonfiction-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "PORT=5000 BASE_PATH=/ pnpm --filter @workspace/nonfiction-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nonfiction-studio", "run", "build" ]
publicDir = "artifacts/nonfiction-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
